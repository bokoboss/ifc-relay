name: visual references

# Takes the reference screenshots for tests/e2e/test_visual.py with the same
# Chromium the test workflow uses, and commits them to the branch.
# Run it from the Actions tab, or push a commit whose message contains [visual-refs].

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]

permissions:
  contents: write

jobs:
  references:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[visual-refs]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: |
          pip install -r requirements.txt -r requirements-dev.txt playwright==1.64.0
          python -m playwright install --with-deps chromium
      - name: Three.js runtime (same files install.bat downloads)
        run: |
          V=0.186.1
          mkdir -p static/vendor/jsm/controls
          curl -fsSL -o static/vendor/three.module.js https://cdn.jsdelivr.net/npm/three@$V/build/three.module.js
          curl -fsSL -o static/vendor/three.core.js https://cdn.jsdelivr.net/npm/three@$V/build/three.core.js
          curl -fsSL -o static/vendor/jsm/controls/OrbitControls.js https://cdn.jsdelivr.net/npm/three@$V/examples/jsm/controls/OrbitControls.js
          sed -i "s#from 'three';#from '../../three.module.js';#; s#from \"three\";#from \"../../three.module.js\";#" static/vendor/jsm/controls/OrbitControls.js
      - name: Take references
        env:
          VBB_E2E: "1"
          VBB_UPDATE_VISUAL: "1"
        run: python -m pytest -q tests/e2e/test_visual.py
      - name: Commit references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/visual
          if git diff --cached --quiet; then echo "references unchanged"; exit 0; fi
          git commit -m "Update visual references ($(cat tests/e2e/visual/BROWSER.txt))"
          git push
