name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Self-contained regression (synthetic IFC, no Vissim)
        run: python -m pytest -q tests
      - name: Static checks (checks/)
        run: |
          python checks/42_check_walkable_merge_v041.py
          python checks/44_check_local_web_app_v041_static.py
          python checks/38_check_export_ui_v031.py
